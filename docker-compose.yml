services:
  db:
    image: public.ecr.aws/docker/library/mariadb:11
    environment:
      MARIADB_DATABASE: ${CIWA_DB_NAME:-ciwa}
      MARIADB_USER: ${CIWA_DB_USER:-ciwa}
      MARIADB_PASSWORD: ${CIWA_DB_PASSWORD:?set CIWA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  crm:
    build: ./deploy/core
    depends_on:
      db:
        condition: service_healthy
    environment:
      CIWA_DB_HOST: db
      CIWA_DB_NAME: ${CIWA_DB_NAME:-ciwa}
      CIWA_DB_USER: ${CIWA_DB_USER:-ciwa}
      CIWA_DB_PASSWORD: ${CIWA_DB_PASSWORD:?set CIWA_DB_PASSWORD}
      CIWA_ADMIN_USER: admin
      CIWA_ADMIN_PASSWORD: ${CIWA_ADMIN_PASSWORD:?set CIWA_ADMIN_PASSWORD}
      CIWA_CORE_PUBLIC_URL: ${CIWA_CORE_PUBLIC_URL:-http://localhost:8081}
      CIWA_CLIENT_ID: ${CIWA_CLIENT_ID:?set CIWA_CLIENT_ID}
      CIWA_CLIENT_SECRET: ${CIWA_CLIENT_SECRET:?set CIWA_CLIENT_SECRET}
      CIWA_PUBLIC_URL: ${CIWA_PUBLIC_URL:-http://localhost:8443}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./core:/var/www/html
    ports:
      - '8081:80'

  integration:
    profiles: ['container']
    image: node:22-alpine
    working_dir: /app
    command: node server.mjs
    depends_on:
      - crm
    environment:
      PORT: 8787
      CIWA_CORE_URL: http://crm
      CIWA_CLIENT_ID: ${CIWA_CLIENT_ID:?set CIWA_CLIENT_ID}
      CIWA_CLIENT_SECRET: ${CIWA_CLIENT_SECRET:?set CIWA_CLIENT_SECRET}
    volumes:
      - ./integration:/app
    ports:
      - '8787:8787'

  frontend:
    profiles: ['container']
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install && pnpm dev --host 0.0.0.0 --port 8443"
    depends_on:
      - integration
    environment:
      PORT: 8443
      CIWA_INTEGRATION_URL: http://integration:8787
    volumes:
      - ./frontend:/app
    ports:
      - '8443:8443'

volumes:
  db_data:
